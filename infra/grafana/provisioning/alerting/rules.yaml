apiVersion: 1

groups:
  - orgId: 1
    name: System Alerts
    folder: AppLogAlerts
    interval: 10s
    rules:
      - uid: system_fix_required
        title: System Error Fix Required
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki-ds
            model:
              refId: A
              expr: sum(count_over_time({app="app-log"} | json | is_fix_required="true" [1m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        for: 0s
        labels:
          severity: critical
          is_fix_required: "true"
        annotations:
          summary: "System Error Detected: Fix Immediately"
          description: "Logs with is_fix_required=true have been detected."
